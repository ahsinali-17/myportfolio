<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g72-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="450" fill="url(#g72-bg)"/>

  <!-- Background Lighting Glow -->
  <circle cx="400" cy="225" r="220" fill="#f59e0b" opacity="0.08" filter="blur(60px)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(60, 35)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="680" height="380" rx="12" fill="#141414" stroke="#262626" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <path d="M0 12 A12 12 0 0 1 12 0 H668 A12 12 0 0 1 680 12 V35 H0 Z" fill="#1c1c1c"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="240" y="8" width="200" height="20" rx="6" fill="#0a0a0a"/>
    <text x="270" y="22" fill="#737373" font-family="monospace" font-size="10">https://g72-clone.vercel.app</text>

    <!-- Website Hero Layout -->
    <!-- Nav Bar -->
    <text x="35" y="68" fill="#ffffff" font-family="'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="2">G72 ARCHITECTURE</text>
    <text x="490" y="68" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="11">PROJECTS</text>
    <text x="560" y="68" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="11">STUDIO</text>
    <text x="620" y="68" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="11">CONTACT</text>

    <!-- Hero Title Animated Text -->
    <text x="35" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">CRAFTING REALITY</text>
    <text x="35" y="205" fill="url(#amber-accent)" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">THROUGH DESIGN.</text>

    <text x="35" y="240" fill="#737373" font-family="system-ui, sans-serif" font-size="13">Interactive GSAP animated layout with smooth scrolling and dynamic typography.</text>

    <!-- Project Cards Grid in website -->
    <rect x="35" y="265" width="190" height="95" rx="6" fill="#262626"/>
    <rect x="245" y="265" width="190" height="95" rx="6" fill="#262626"/>
    <rect x="455" y="265" width="190" height="95" rx="6" fill="#262626"/>

    <!-- Accent Lines -->
    <line x1="35" y1="265" x2="225" y2="265" stroke="#f59e0b" stroke-width="2"/>
    <line x1="245" y1="265" x2="435" y2="265" stroke="#f59e0b" stroke-width="2"/>
    <line x1="455" y1="265" x2="645" y2="265" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>
