<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sundown-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff7043"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="450" fill="url(#sundown-bg)"/>

  <!-- Orange Liquid Glow Blob effect -->
  <circle cx="600" cy="180" r="160" fill="#ff5722" opacity="0.35" filter="blur(50px)"/>
  <circle cx="500" cy="240" r="120" fill="#ff9800" opacity="0.25" filter="blur(40px)"/>

  <!-- Browser Window Frame -->
  <g transform="translate(60, 35)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect width="680" height="380" rx="12" fill="#141414" stroke="#292524" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <path d="M0 12 A12 12 0 0 1 12 0 H668 A12 12 0 0 1 680 12 V35 H0 Z" fill="#1c1917"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="240" y="8" width="200" height="20" rx="6" fill="#0c0a09"/>
    <text x="260" y="22" fill="#78716c" font-family="monospace" font-size="10">https://sundown-clone.vercel.app</text>

    <!-- Sundown Navigation -->
    <text x="35" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1">Sundown</text>
    <rect x="520" y="52" width="125" height="26" rx="13" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="545" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Menu ☰</text>

    <!-- Big Sundown Headline -->
    <text x="35" y="160" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">SPACES THAT</text>
    <text x="35" y="215" fill="url(#orange-glow)" font-family="system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">INSPIRE CREATIVITY</text>

    <!-- Secondary Text -->
    <text x="35" y="250" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">Sundown Studio award-winning site replica with GSAP animations & Custom Cursor.</text>

    <!-- Video preview card mockup with play icon -->
    <rect x="420" y="110" width="225" height="150" rx="16" fill="#292524" stroke="#ff5722" stroke-width="1"/>
    <circle cx="532" cy="185" r="24" fill="url(#orange-glow)"/>
    <polygon points="527,175 542,185 527,195" fill="#ffffff"/>

    <!-- Bottom Ticker Line -->
    <line x1="0" y1="310" x2="680" y2="310" stroke="#44403c" stroke-width="1"/>
    <text x="35" y="340" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="4">EXPERIENCE • DESIGN • ANIMATION • GSAP •</text>
  </g>
</svg>
